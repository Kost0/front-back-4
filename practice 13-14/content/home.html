<section class="input-section">
  <div class="input-card">
    <h2 class="input-title">Новая заметка</h2>
    <form id="note-form" class="note-form">
      <input
        id="note-title"
        class="field-input"
        type="text"
        placeholder="Заголовок заметки"
        required
        autocomplete="off"
      >
      <textarea
        id="note-body"
        class="field-textarea"
        placeholder="Текст заметки (необязательно)"
        rows="3"
      ></textarea>
      <button class="btn-add" type="submit">Добавить заметку</button>
    </form>
  </div>

  <div class="input-card">
    <h2 class="input-title">Заметка с напоминанием</h2>
    <form id="reminder-form" class="note-form">
      <input
        id="reminder-text"
        class="field-input"
        type="text"
        placeholder="Текст напоминания"
        required
        autocomplete="off"
      >
      <input
        id="reminder-time"
        class="field-input"
        type="datetime-local"
        required
      >
      <button class="btn-add btn-reminder" type="submit">Добавить с напоминанием</button>
    </form>
  </div>
</section>

<section class="notes-section">
  <div class="notes-header">
    <span class="notes-title">Заметки</span>
    <span id="notes-count" class="notes-count">0</span>
  </div>

  <div id="notes-empty" class="notes-empty">
    <p>Заметок пока нет — добавьте первую!</p>
  </div>

  <ul id="notes-list" class="notes-list"></ul>
</section>
