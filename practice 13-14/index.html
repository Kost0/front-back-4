<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="./manifest.json">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2D3A8C">

  <link rel="apple-touch-icon" href="./icons/favicon-128x128.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="./icons/favicon.ico" sizes="16x16" type="image/x-icon">
  <link rel="icon" href="./icons/favicon-32x32.png" sizes="32x32" type="image/png">

  <title>Мои заметки — App Shell</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-text">Заметки</span>
        </div>

        <nav class="shell-nav" aria-label="Навигация">
          <button id="home-btn" class="shell-tab is-active" type="button">Главная</button>
          <button id="about-btn" class="shell-tab" type="button">О приложении</button>
        </nav>
      </div>
    </header>

    <main id="app-content" class="main-content" aria-live="polite">
      <div class="notes-empty" style="margin-top: 12px;">
        <p>Загрузка…</p>
      </div>
    </main>

    <footer class="app-footer">
      <div class="push-controls">
        <button id="enable-push" class="btn-push btn-push-on" type="button">Включить уведомления</button>
        <button id="disable-push" class="btn-push btn-push-off" type="button" style="display:none;">Отключить уведомления</button>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./app.js"></script>
</body>
</html>
