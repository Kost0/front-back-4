<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест авторизации</title>
</head>
<body>

<h2>Регистрация</h2>
<input id="reg-email" placeholder="email" /><br><br>
<input id="reg-fname" placeholder="first_name" /><br><br>
<input id="reg-lname" placeholder="last_name" /><br><br>
<input id="reg-pass" placeholder="password" type="password" /><br><br>
<button onclick="register()">Зарегистрироваться</button>
<p id="reg-result"></p>

<h2>Вход</h2>
<input id="login-email" placeholder="email" /><br><br>
<input id="login-pass" placeholder="password" type="password" /><br><br>
<button onclick="login()">Войти</button>
<p id="login-result"></p>

<div id="token-block" style="display:none">
  <b>Токен:</b><br>
  <textarea id="token-value" rows="4" cols="80" readonly></textarea><br>
  <span id="copy-hint"></span>
</div>

<script>
  function showResult(elementId, ok, message) {
    const el = document.getElementById(elementId);
    el.textContent = ok ? 'Успешно' : 'Неправильные данные: ' + message;
  }

  function showToken(token) {
    document.getElementById('token-value').value = token;
    document.getElementById('token-block').style.display = 'block';
  }

  async function register() {
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('reg-email').value,
          first_name: document.getElementById('reg-fname').value,
          last_name: document.getElementById('reg-lname').value,
          password: document.getElementById('reg-pass').value,
        })
      });
      const data = await res.json();
      showResult('reg-result', res.ok, data.error);
    } catch (e) {
      showResult('reg-result', false, 'Сервер недоступен');
    }
  }

  async function login() {
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-pass').value,
        })
      });
      const data = await res.json();
      showResult('login-result', res.ok, data.error);
      if (res.ok && data.accessToken) {
        showToken(data.accessToken);
      }
    } catch (e) {
      showResult('login-result', false, 'Сервер недоступен');
    }
  }
</script>

</body>
</html>
